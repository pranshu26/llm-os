name: Build LLM OS image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test the bootc image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --file Containerfile --tag llm-os:ci .
      - run: |
          docker run --rm --entrypoint /bin/bash llm-os:ci -euc '
            llama-cli --version
            llm-run --help
            test -f /usr/lib/systemd/user/llm-interactive.slice
            test -f /usr/lib/systemd/user/llm-background.slice
          '
